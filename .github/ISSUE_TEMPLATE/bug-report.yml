name: 缺陷报告
description: 报告示例、脚本或教程步骤中的可复现问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小命令、输入和相关章节。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、Git 与相关工具版本
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 可脱敏的退出码、日志片段或截图；请勿提交凭据。
